name: nix-check

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  flake-check:
    name: nix-check (${{ matrix.host }})
    runs-on: macos-14   # Apple Silicon (M1)
    # Phase 20: 新ホスト追加時は matrix.host に 1 行追加するだけで build 検証される。
    # fail-fast=false にしておき、1 ホストの失敗で他ホストの検証を巻き添えにしない。
    strategy:
      fail-fast: false
      matrix:
        host: [private]
    steps:
      - uses: actions/checkout@v4

      # nixpkgs の stale / EOL channel / 既知脆弱 input を検出。
      # https://github.com/DeterminateSystems/flake-checker-action
      # 各 action は supply-chain hygiene のため mutable な `@main` ではなく
      # major-version moving tag に pin する。upstream breaking change 対策に
      # 月次で minor まで bump 確認 (Determinate Systems は破壊的変更時に major bump 運用)。
      - name: Flake health check
        uses: DeterminateSystems/flake-checker-action@v12
        with:
          fail-mode: true
          send-statistics: false

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Enable FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@v3

      - name: Show flake metadata
        run: nix flake metadata

      - name: Evaluate flake
        run: nix flake check --no-build

      # NOTE: statix (anti-pattern lint) と deadnix (unused decl) は将来的に
      # 組み込む価値があるが、現状コードベースで warning が多数残るため
      # 別 PR で fix → 有効化の二段で進める。検出だけ走らせるなら下を有効化:
      #   - run: nix run nixpkgs#statix  -- check .  || true
      #   - run: nix run nixpkgs#deadnix -- .         || true

      - name: Build darwin system (${{ matrix.host }})
        run: nix build ".#darwinConfigurations.\"${{ matrix.host }}\".system" --no-link --print-build-logs
